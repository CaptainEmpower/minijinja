name: Pyright

on: [push, pull_request]

jobs:
  pyright:
    name: Pyright
    runs-on: ubuntu-24.04  # ubuntu-latest (26.04) has no Python 3.9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Run pyright
        run: make python-type-check
